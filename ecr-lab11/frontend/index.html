<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Event Board</title>
    <style>
      :root {
        --bg-top: #f6eadf;
        --bg-bottom: #d8e8ee;
        --paper: #fffaf2;
        --ink: #111418;
        --muted: #5e6672;
        --primary: #0b7fab;
        --accent: #d05d3f;
        --line: #ded6c5;
        --ok: #2a8d62;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--ink);
        font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
        background:
          radial-gradient(circle at 12% 10%, #fff4da 0 25%, transparent 40%),
          radial-gradient(circle at 85% 20%, #dff3ff 0 20%, transparent 38%),
          linear-gradient(140deg, var(--bg-top), var(--bg-bottom));
      }

      .shell {
        width: min(1100px, 92vw);
        margin: 2rem auto 2.5rem;
      }

      .hero {
        border: 1px solid var(--line);
        border-radius: 20px;
        background: linear-gradient(115deg, rgba(255, 250, 242, 0.94), rgba(255, 250, 242, 0.82));
        backdrop-filter: blur(3px);
        padding: 1.6rem;
        box-shadow: 0 18px 40px rgba(50, 50, 50, 0.1);
      }

      h1 {
        font-size: clamp(1.8rem, 3vw, 2.6rem);
        margin: 0 0 0.35rem;
        letter-spacing: 0.02em;
      }

      .subtitle {
        margin: 0;
        color: var(--muted);
      }

      .stats {
        margin-top: 1rem;
        display: grid;
        gap: 0.75rem;
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .chip {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 0.7rem 0.9rem;
      }

      .chip small {
        color: var(--muted);
        display: block;
      }

      .chip strong {
        font-size: 1.15rem;
      }

      .layout {
        margin-top: 1rem;
        display: grid;
        grid-template-columns: 1.4fr 1fr;
        gap: 1rem;
      }

      .panel {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 1rem;
      }

      .panel h2 {
        margin-top: 0;
        margin-bottom: 0.8rem;
      }

      .toolbar {
        display: grid;
        grid-template-columns: 2fr 1fr auto;
        gap: 0.5rem;
        margin-bottom: 0.8rem;
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid #ccc4b4;
        background: #fffdf8;
        border-radius: 10px;
        padding: 0.55rem 0.65rem;
        font: inherit;
      }

      button {
        border: 0;
        border-radius: 10px;
        padding: 0.6rem 0.85rem;
        color: #fff;
        background: linear-gradient(145deg, var(--primary), #0a688c);
        cursor: pointer;
        font: inherit;
      }

      button.alt {
        background: linear-gradient(145deg, var(--accent), #b84e33);
      }

      .events {
        display: grid;
        gap: 0.65rem;
      }

      .event-card {
        border: 1px solid #d8cfbf;
        border-radius: 12px;
        padding: 0.75rem;
        background: linear-gradient(180deg, #fffefb, #f9f2e7);
        animation: reveal 0.35s ease both;
      }

      .event-top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 0.5rem;
      }

      .event-title {
        margin: 0;
        font-size: 1.05rem;
      }

      .badge {
        font-size: 0.78rem;
        padding: 0.2rem 0.5rem;
        border-radius: 999px;
        color: #fff;
        background: var(--ok);
      }

      .meta {
        color: var(--muted);
        margin: 0.35rem 0;
        font-size: 0.95rem;
      }

      .desc {
        margin: 0;
      }

      .hint {
        color: var(--muted);
        font-size: 0.92rem;
      }

      .status {
        margin-top: 0.6rem;
        color: var(--muted);
        min-height: 1.2em;
      }

      @keyframes reveal {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 900px) {
        .stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .layout {
          grid-template-columns: 1fr;
        }

        .toolbar {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <h1>Campus Event Board</h1>
        <p class="subtitle">A polished full-stack showcase: realtime event listing, filtering, and event publishing workflow.</p>

        <div class="stats">
          <div class="chip"><small>Total Events</small><strong id="stat-events">-</strong></div>
          <div class="chip"><small>Total Seats</small><strong id="stat-seats-total">-</strong></div>
          <div class="chip"><small>Reserved Seats</small><strong id="stat-seats-taken">-</strong></div>
          <div class="chip"><small>Occupancy</small><strong id="stat-occupancy">-</strong></div>
        </div>
      </section>

      <section class="layout">
        <article class="panel">
          <h2>Event Feed</h2>
          <div class="toolbar">
            <input id="search" placeholder="Search title, location, description" />
            <select id="categoryFilter">
              <option value="">All categories</option>
              <option value="Tech">Tech</option>
              <option value="Career">Career</option>
              <option value="Community">Community</option>
              <option value="General">General</option>
            </select>
            <button id="refresh">Refresh</button>
          </div>
          <div id="events" class="events"></div>
          <p class="status" id="status"></p>
        </article>

        <aside class="panel">
          <h2>Publish Event</h2>
          <p class="hint">Fill in details to add a new event card instantly.</p>
          <input id="title" placeholder="Event title" />
          <input id="date" placeholder="Date (YYYY-MM-DD)" />
          <input id="location" placeholder="Location" />
          <select id="category">
            <option value="Tech">Tech</option>
            <option value="Career">Career</option>
            <option value="Community">Community</option>
            <option value="General" selected>General</option>
          </select>
          <input id="audience" placeholder="Audience (e.g., All Students)" value="All Students" />
          <input id="seatsTotal" type="number" min="1" placeholder="Total seats" value="100" />
          <input id="seatsTaken" type="number" min="0" placeholder="Seats taken" value="0" />
          <textarea id="description" rows="4" placeholder="Description"></textarea>
          <button class="alt" id="create">Create Event</button>
        </aside>
      </section>
    </main>

    <script>
      const nodes = {
        events: document.getElementById('events'),
        status: document.getElementById('status'),
        statEvents: document.getElementById('stat-events'),
        statSeatsTotal: document.getElementById('stat-seats-total'),
        statSeatsTaken: document.getElementById('stat-seats-taken'),
        statOccupancy: document.getElementById('stat-occupancy')
      };

      function renderEvents(list) {
        if (!list.length) {
          nodes.events.innerHTML = '<p class="hint">No events match your filters.</p>';
          return;
        }

        nodes.events.innerHTML = list
          .map((event) => {
            const occupancy = event.seats_total
              ? Math.round((event.seats_taken / event.seats_total) * 100)
              : 0;
            return `
              <article class="event-card">
                <div class="event-top">
                  <h3 class="event-title">${event.title}</h3>
                  <span class="badge">${event.category || 'General'}</span>
                </div>
                <p class="meta">${event.date} • ${event.location} • ${event.audience || 'All Students'}</p>
                <p class="meta">Seats: ${event.seats_taken}/${event.seats_total} (${occupancy}%)</p>
                <p class="desc">${event.description}</p>
              </article>
            `;
          })
          .join('');
      }

      async function loadStats() {
        const res = await fetch('/api/stats');
        const stats = await res.json();
        nodes.statEvents.textContent = stats.total_events;
        nodes.statSeatsTotal.textContent = stats.seats_total;
        nodes.statSeatsTaken.textContent = stats.seats_taken;
        nodes.statOccupancy.textContent = `${stats.occupancy_rate}%`;
      }

      async function loadEvents() {
        const q = document.getElementById('search').value.trim();
        const category = document.getElementById('categoryFilter').value;
        const params = new URLSearchParams();
        if (q) params.set('q', q);
        if (category) params.set('category', category);

        nodes.status.textContent = 'Loading events...';
        try {
          const url = params.toString() ? `/api/events?${params.toString()}` : '/api/events';
          const res = await fetch(url);
          const events = await res.json();
          renderEvents(events);
          await loadStats();
          nodes.status.textContent = `Loaded ${events.length} event(s)`;
        } catch (err) {
          nodes.status.textContent = err.message;
        }
      }

      async function createEvent() {
        const payload = {
          title: document.getElementById('title').value,
          date: document.getElementById('date').value,
          location: document.getElementById('location').value,
          category: document.getElementById('category').value,
          audience: document.getElementById('audience').value,
          seats_total: Number(document.getElementById('seatsTotal').value),
          seats_taken: Number(document.getElementById('seatsTaken').value),
          description: document.getElementById('description').value
        };

        nodes.status.textContent = 'Publishing event...';
        try {
          const res = await fetch('/api/events', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const body = await res.json();

          if (!res.ok) {
            nodes.status.textContent = `Error: ${body.error || 'Failed to create event'}`;
            return;
          }

          nodes.status.textContent = `Created event #${body.id}`;
          await loadEvents();
        } catch (err) {
          nodes.status.textContent = err.message;
        }
      }

      document.getElementById('refresh').addEventListener('click', loadEvents);
      document.getElementById('create').addEventListener('click', createEvent);
      document.getElementById('search').addEventListener('input', () => {
        clearTimeout(window.__eventSearchTimer);
        window.__eventSearchTimer = setTimeout(loadEvents, 250);
      });
      document.getElementById('categoryFilter').addEventListener('change', loadEvents);

      loadEvents();
    </script>
  </body>
</html>
