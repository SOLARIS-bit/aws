<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Full Stack Homework</title>
    <style>
      :root {
        --bg: #f7f4ee;
        --panel: #fffdf8;
        --ink: #1b1a17;
        --accent: #c15f3c;
      }
      body {
        margin: 0;
        font-family: Georgia, 'Times New Roman', serif;
        background: radial-gradient(circle at top left, #fff3d9, var(--bg));
        color: var(--ink);
      }
      .wrap {
        max-width: 760px;
        margin: 4rem auto;
        padding: 2rem;
        background: var(--panel);
        border: 1px solid #e6dcc9;
        border-radius: 14px;
      }
      h1 { margin-top: 0; }
      button {
        background: var(--accent);
        color: white;
        border: 0;
        padding: 0.6rem 1rem;
        border-radius: 8px;
        cursor: pointer;
      }
      pre {
        white-space: pre-wrap;
        background: #f3ecdf;
        padding: 1rem;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1>Full Stack Demo</h1>
      <p>Frontend + Backend (+ optional DB) ready for Docker/ECS.</p>
      <button id="load">Load Messages</button>
      <pre id="out">Click the button to fetch /api/messages</pre>
    </main>

    <script>
      const out = document.getElementById('out');
      document.getElementById('load').addEventListener('click', async () => {
        try {
          const res = await fetch('/api/messages');
          const data = await res.json();
          out.textContent = JSON.stringify(data, null, 2);
        } catch (err) {
          out.textContent = err.message;
        }
      });
    </script>
  </body>
</html>
